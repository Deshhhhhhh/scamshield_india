<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill: #16233d; stroke: #33446666; stroke-width: 1.5; rx: 12; }
      .hot { fill: #1c2a47; stroke: #f97316; stroke-width: 1.5; }
      .core { fill: #0f1a2e; stroke: #f97316; stroke-width: 2; }
      .t { fill: #e7ecf5; font-size: 13px; font-weight: 600; }
      .s { fill: #9fb0cd; font-size: 11px; }
      .lbl { fill: #fdba74; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
      .arrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- title -->
  <text x="30" y="28" class="t" font-size="15">ScamShield India — system architecture (no-card, free-tier design)</text>

  <!-- User -->
  <rect x="30" y="60" width="170" height="86" rx="12" class="box"/>
  <text x="46" y="90" class="t">👤 Citizen</text>
  <text x="46" y="110" class="s">Forwards any SMS /</text>
  <text x="46" y="126" class="s">WhatsApp message</text>

  <!-- Telegram bot -->
  <rect x="270" y="60" width="185" height="86" rx="12" class="box"/>
  <text x="288" y="90" class="t">🤖 Telegram bot</text>
  <text x="288" y="110" class="s">Long-polling client</text>
  <text x="288" y="126" class="s">of the REST API</text>

  <!-- Landing page -->
  <rect x="30" y="230" width="170" height="96" rx="12" class="box"/>
  <text x="46" y="260" class="t">🌐 Landing page</text>
  <text x="46" y="280" class="s">Static HTML + GA4</text>
  <text x="46" y="296" class="s">(measurement ID,</text>
  <text x="46" y="312" class="s">replace before launch)</text>

  <!-- Core API -->
  <rect x="530" y="52" width="320" height="330" rx="14" class="core"/>
  <text x="548" y="80" class="lbl">SCAMSHIELD API · FastAPI · /v1</text>

  <rect x="556" y="96" width="268" height="54" rx="10" class="hot"/>
  <text x="572" y="119" class="t">1 · PII scrubber</text>
  <text x="572" y="137" class="s">phone · OTP · Aadhaar · PAN · UPI · urls</text>

  <rect x="556" y="162" width="268" height="54" rx="10" class="box"/>
  <text x="572" y="185" class="t">2 · Baseline ML</text>
  <text x="572" y="203" class="s">TF-IDF + LogisticRegression (offline)</text>

  <rect x="556" y="228" width="268" height="54" rx="10" class="box"/>
  <text x="572" y="251" class="t">3 · LLM + fallback</text>
  <text x="572" y="269" class="s">Gemini (free tier) → offline explainer</text>

  <rect x="556" y="294" width="268" height="54" rx="10" class="box"/>
  <text x="572" y="317" class="t">4 · Risk fusion + red flags</text>
  <text x="572" y="335" class="s">score 0–100 · band · explanation EN/HI</text>

  <!-- Storage -->
  <rect x="1010" y="52" width="200" height="96" rx="12" class="box"/>
  <text x="1026" y="82" class="t">🗄️ SQLite</text>
  <text x="1026" y="102" class="s">scrubbed text +</text>
  <text x="1026" y="118" class="s">sha256(raw) only · WAL</text>

  <!-- Metrics -->
  <rect x="1010" y="196" width="200" height="76" rx="12" class="box"/>
  <text x="1026" y="226" class="t">📈 Prometheus</text>
  <text x="1026" y="246" class="s">/v1/metrics · latency,</text>
  <text x="1026" y="262" class="s">LLM path, PII counts</text>

  <!-- Dashboard -->
  <rect x="1010" y="320" width="200" height="86" rx="12" class="box"/>
  <text x="1026" y="350" class="t">📊 Streamlit</text>
  <text x="1026" y="370" class="s">trends · types · red</text>
  <text x="1026" y="386" class="s">flags · advisories</text>

  <!-- Grafana -->
  <rect x="1010" y="452" width="200" height="64" rx="12" class="box"/>
  <text x="1026" y="480" class="t">📉 Grafana</text>
  <text x="1026" y="500" class="s">SLO dashboards + alerts</text>

  <!-- Advisory automation -->
  <rect x="270" y="470" width="280" height="120" rx="12" class="box"/>
  <text x="288" y="500" class="t">⏰ Advisory collector</text>
  <text x="288" y="520" class="s">GitHub Actions cron (daily)</text>
  <text x="288" y="536" class="s">RSS: The Hindu, TOI +</text>
  <text x="288" y="552" class="s">curated RBI / I4C / CERT-In seed</text>

  <!-- CI -->
  <rect x="30" y="430" width="190" height="130" rx="12" class="box"/>
  <text x="46" y="460" class="t">✅ CI / CD</text>
  <text x="46" y="480" class="s">ruff · mypy · pytest 51</text>
  <text x="46" y="496" class="s">golden-F1 gate ≥ 0.90</text>
  <text x="46" y="512" class="s">pip-audit · docker build</text>
  <text x="46" y="528" class="s">coverage ≥ 70%</text>

  <!-- arrows -->
  <path class="arrow" d="M200 103 L270 103"/>
  <path class="arrow" d="M455 103 C490 103 490 210 530 210"/>
  <path class="arrow" d="M690 150 L690 162"/>
  <path class="arrow" d="M690 216 L690 228"/>
  <path class="arrow" d="M690 282 L690 294"/>
  <path class="arrow" d="M850 140 L1010 105"/>
  <path class="arrow" d="M850 250 L1010 235"/>
  <path class="arrow" d="M1110 148 L1110 196"/>
  <path class="arrow" d="M1110 272 L1110 320"/>
  <path class="arrow" d="M550 480 C700 470 850 330 1010 330"/>
  <path class="arrow" d="M115 146 C115 200 140 230 60 268" opacity="0"/>
  <path class="arrow" d="M115 430 L115 330"/>
  <path class="arrow" d="M1110 363 L1110 350" opacity="0"/>
</svg>
