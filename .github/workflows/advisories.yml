name: Collect scam advisories

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch live advisories (RSS) + curated baseline
        run: python automation/fetch_advisories.py --online --seed-if-empty --out data/advisories.json
      - name: Commit refreshed advisory snapshot
        run: |
          git config user.name "scamshield-bot"
          git config user.email "actions@github.com"
          git add data/advisories.json
          git diff --cached --quiet || git commit -m "chore(data): refresh scam advisory snapshot [skip ci]"
          git push
